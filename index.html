<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shelly Shutter</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Local shutter control</p>
            <h1>Shelly Shutter</h1>
          </div>
          <div class="topbar-actions">
            <div class="status-pill" id="connectionStatus">Not connected</div>
            <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-expanded="false">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a2 2 0 0 1-4 0V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.8a2 2 0 0 1 0-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 0 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 .9-1.6v-.2a2 2 0 0 1 4 0V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6.9h.2a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="control-surface">
          <div class="visual">
            <img src="./assets/shutter.svg" alt="" aria-hidden="true">
            <div>
              <p class="label">Position</p>
              <p class="position" id="positionText">--%</p>
              <p class="state" id="stateText">Waiting for device</p>
            </div>
          </div>

          <div class="buttons" aria-label="Shutter commands">
            <button id="openButton" type="button">Open</button>
            <button id="stopButton" class="danger" type="button">Stop</button>
            <button id="closeButton" type="button">Close</button>
          </div>

          <label class="slider-label">
            Target position
            <span id="targetText">50%</span>
          </label>
          <input id="positionSlider" type="range" min="0" max="100" value="50">
          <button id="goButton" class="wide" type="button">Move to position</button>
        </div>

        <p class="message" id="message" role="status" aria-live="polite"></p>
      </section>
    </main>

    <div class="modal-backdrop" id="settingsModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="modal-header">
          <h2 id="settingsTitle">Settings</h2>
          <button class="icon-button secondary-icon" id="closeSettingsButton" type="button" aria-label="Close settings">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>

        <div class="settings">
          <label>
            Shelly address
            <input id="hostInput" type="text" inputmode="url" placeholder="192.168.1.42 or http://shellyplus2pm.local">
          </label>
          <label>
            Cover id
            <input id="coverIdInput" type="number" min="0" step="1" value="0">
          </label>
        </div>

        <div class="modal-actions">
          <button id="testButton" class="secondary" type="button">Test connection</button>
          <button id="saveButton" type="button">Save</button>
        </div>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
